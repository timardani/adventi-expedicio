server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # a demó ne kerüljön keresőbe
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # a döntésérzékelő (parallaxis) engedélyezése a saját oldalnak
  add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  # a Vite saját fájljai névben hordozzák a tartalom-hasht
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=3600" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
